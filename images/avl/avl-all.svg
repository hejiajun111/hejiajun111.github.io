<rect x="0" y="0" width="2450" height="990" fill="#e2e8f0"/>
<svg x="22" y="22" width="1180" height="461" viewBox="0 0 960 450" preserveAspectRatio="xMidYMid meet"><title>LL 型 · 右旋 AVL 旋转示意图</title><desc>LL 是失衡路径：左 → 左；调整方向是右旋。 </desc>
