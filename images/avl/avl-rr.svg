<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img">
<style>
text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
.title { font-weight:750; font-size:29px; fill:#0f172a; }
.muted { fill:#64748b; font-size:17px; }
.stage { font-size:20px; font-weight:650; fill:#334155; }
.node { fill:white; font-weight:700; text-anchor:middle; dominant-baseline:middle; font-size:21px; }
.arrow-label { fill:#0f766e; font-size:15px; font-weight:650; text-anchor:middle; }
.footer { fill:#475569; font-size:16px; }
</style>
<title>RR 型 · 左旋 AVL 旋转示意图</title><desc>RR 是失衡路径：右 → 右；调整方向是左旋。 </desc>
<rect x="0" y="0" width="960" height="450" rx="18" fill="#ffffff"/>
<rect x="0" y="0" width="7" height="450" fill="#14b8a6"/>
<text class="title" x="32" y="45">RR 型 · 左旋</text>
<text class="muted" x="32" y="80">插入顺序：10 → 20 → 30</text>
<line x1="32" y1="102" x2="928" y2="102" stroke="#e2e8f0"/>
<rect x="20" y="117" width="410" height="265" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
<text class="stage" x="42" y="151">失衡前</text>
<line x1="225" y1="200" x2="296" y2="269" stroke="#94a3b8" stroke-width="3.6" stroke-linecap="round"/>
<line x1="296" y1="269" x2="352" y2="337" stroke="#94a3b8" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="225" cy="200" r="26" fill="#dc6b4f" stroke="#ffffff" stroke-width="3"/>
<text class="node" x="225" y="201">10</text>
<circle cx="296" cy="269" r="26" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
<text class="node" x="296" y="270">20</text>
<circle cx="352" cy="337" r="26" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
<text class="node" x="352" y="338">30</text>
<rect x="530" y="117" width="410" height="265" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
<text class="stage" x="552" y="151">左旋 10 后</text>
<line x1="735" y1="220" x2="644" y2="319" stroke="#94a3b8" stroke-width="3.6" stroke-linecap="round"/>
<line x1="735" y1="220" x2="826" y2="319" stroke="#94a3b8" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="735" cy="220" r="26" fill="#0d9488" stroke="#ffffff" stroke-width="3"/>
<text class="node" x="735" y="221">20</text>
<circle cx="644" cy="319" r="26" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
<text class="node" x="644" y="320">10</text>
<circle cx="826" cy="319" r="26" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
<text class="node" x="826" y="320">30</text>
<text class="arrow-label" x="480.0" y="233">左旋 10</text>
<path d="M461.0 255 H497.0 M487.0 244 L499.0 255 L487.0 266" fill="none" stroke="#0f766e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="footer" x="32" y="422">RR 是失衡路径：右 → 右；调整方向是左旋。</text>
</svg>