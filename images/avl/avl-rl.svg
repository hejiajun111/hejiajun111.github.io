<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 450" role="img">
<style>
text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
.title { font-weight:750; font-size:29px; fill:#0f172a; }
.muted { fill:#64748b; font-size:17px; }
.stage { font-size:20px; font-weight:650; fill:#334155; }
.node { fill:white; font-weight:700; text-anchor:middle; dominant-baseline:middle; font-size:21px; }
.arrow-label { fill:#0f766e; font-size:15px; font-weight:650; text-anchor:middle; }
.footer { fill:#475569; font-size:16px; }
</style>
<title>RL 型 · 先右旋，再左旋 AVL 旋转示意图</title><desc>先把折线拉直（右旋 30），再修复失衡节点（左旋 10）。 </desc>
